
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Management System</title>
<style>
- { box-sizing: border-box; font-family: Arial, sans-serif; }
body { margin: 0; background: #eef2f7; }
header { background: #1e3a5f; color: white; padding: 20px; text-align: center; font-size: 28px; font-weight: bold; }
.container { max-width: 900px; margin: 20px auto; background: white; padding: 20px; border-radius: 12px; }
h2 { color: #1e3a5f; }
input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
.add-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 13px; border-radius: 8px; font-size: 16px; cursor: pointer; }
table { width: 100%; border-collapse: collapse; margin-top: 10px; }
th { background: #dbeafe; padding: 12px; text-align: left; }
td { padding: 12px; border-bottom: 1px solid #ddd; }
.issue-btn { background: #22c55e; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
.delete-btn { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; margin-left: 5px; }
</style>
</head>
<body>
<header>📚 Library Management System</header>
<div class="container">
<h2>Add New Book</h2>
<input type="text" id="bookName" placeholder="Enter Book Name">
<input type="text" id="authorName" placeholder="Enter Author Name">
<input type="text" id="bookId" placeholder="Enter Book ID">
<button class="add-btn" onclick="addBook()">Add Book</button>
<h2>Search Book</h2>
<input type="text" id="search" placeholder="Search Book" onkeyup="searchBook()">
<h2>Book List</h2>
<table>
<tr>
<th>Book ID</th>
<th>Book Name</th>
<th>Author</th>
<th>Status</th>
<th>Action</th>
</tr>
<tbody id="bookList"></tbody>
</table>
</div>
<script>
let books = [];
function addBook(){
let name = http://document.getElementById("bookName").value;
let author = http://document.getElementById("authorName").value;
let id = http://document.getElementById("bookId").value;
if(name=="" || author=="" || id==""){
alert("Please fill all fields");
return;
}
http://books.push({id:id, name:name, author:author, status:"Available"});
displayBooks();
http://document.getElementById("bookName").value="";
http://document.getElementById("authorName").value="";
http://document.getElementById("bookId").value="";
}
function displayBooks(){
let list = http://document.getElementById("bookList");
http://list.innerHTML = "";
http://books.forEach((book, index) => {
http://list.innerHTML += `<tr>
<td>${book.id}</td>
<td>${book.name}</td>
<td>${book.author}</td>
<td>${book.status}</td>
<td>
<button class="issue-btn" onclick="issueBook(${index})">Issue</button>
<button class="delete-btn" onclick="deleteBook(${index})">Delete</button>
</td>
</tr>`;
});
}
function issueBook(index){
if(books[index].status=="Available"){
books[index].status="Issued";
} else {
books[index].status="Available";
}
displayBooks();
}
function deleteBook(index){
http://books.splice(index,1);
displayBooks();
}
function searchBook(){
let word = http://document.getElementById("search").value.toLowerCase();
let rows = http://document.getElementById("bookList").getElementsByTagName("tr");
for(let row of rows){
let text = http://row.innerText.toLowerCase();
http://row.style.display = http://text.includes(word) ? "" : "none";
}
}
</script>
</body>
</html>
